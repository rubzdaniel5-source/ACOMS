<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — ACOMS</title>
<style>
  :root { color-scheme: light dark; --bg:#F3F7FC; --text:#0F172A; --muted:#52657D; --btn:#2563EB; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0F172A; --text:#E6EDF7; --muted:#9FB0C7; --btn:#3B82F6; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:26rem; padding:2rem 1rem; text-align:center; }
  h1 { font-size:1.5rem; margin:0 0 .75rem; }
  p { color:var(--muted); margin:0 0 1.5rem; }
  a { display:inline-block; background:var(--btn); color:#fff; padding:.7rem 1.4rem; border-radius:.5rem; text-decoration:none; font-weight:600; min-height:44px; box-sizing:border-box; }
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>ACOMS needs a connection to show current stock and to record changes, so nothing is shown from memory. Check your signal or Wi-Fi, then try again.</p>
  <a href="/dashboard">Try again</a>
</main>
</body>
</html>
