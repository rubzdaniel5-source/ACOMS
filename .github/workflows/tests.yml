name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  database:
    name: Database business rules
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply every migration and run the rule tests
        run: bash acoms-app/supabase/tests/run.sh

  app:
    name: Type check and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acoms-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: acoms-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
